services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zz_proxy_file
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ../../.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zz_proxy_file"]
      interval: 2s
      timeout: 3s
      retries: 15
